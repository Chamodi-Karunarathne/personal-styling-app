spring.application.name=styling-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/styling_db}
spring.datasource.username=${DB_USERNAME:styling_user}
spring.datasource.password=${DB_PASSWORD:styling_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true