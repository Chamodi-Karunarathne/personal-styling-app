spring.application.name=styling-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Request/validation debug logs and JDBC diagnostics can contain passwords or row values.
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF

# Security diagnostics may contain session IDs. Keep them out of application logs.
logging.level.org.springframework.security=INFO
logging.level.org.apache.catalina.session=INFO

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
server.servlet.session.cookie.path=/

app.security.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
